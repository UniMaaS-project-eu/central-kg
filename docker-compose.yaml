include:
  - ../../ed-node/docker-compose-connectorcp.yml  

services:
  central-platform-graphdb:
    hostname: central-platform-graphdb
    image: ontotext/graphdb:10.3.3
    container_name: central-platform-graphdb
    restart: unless-stopped
    environment:
      GDB_HEAP_SIZE: 4g
      GDB_MIN_MEM: 1g
      GDB_MAX_MEM: 4g
      GRAPHDB_SECURITY: "true"
      GRAPHDB_ADMIN_PASSWORD: "mypassword"   # change this!
    ports:
      - "7200:7200"
    volumes:
      - ./graphdb/graphdb-data:/opt/graphdb/home
      - ./graphdb/config:/config
    networks:
      - edc-network

  central-platform-postgres:
    hostname: central-platform-postgres
    image: postgres:18
    container_name: central-platform-postgres
    environment:
      POSTGRES_USER: admin 
      POSTGRES_PASSWORD: admin # change this!
      POSTGRES_DB: postgrescp     
    volumes:
      - ./postgres/postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - edc-network

  central-platform-federated-catalog:
    hostname: central-platform-federated-catalog
    image: standalone-federated-catalog
    container_name: central-platform-federated-catalog
    volumes:
      - vault-init-data-connectorcp:/vault-token:ro
      - ./env/standalone-catalog.env:/etc/app/env-file:ro
    networks:
      - edc-network
    ports:
      - "8184:8184" # catalog
      - "8181:8181" # management

    environment:
      - EDC_HOSTNAME=${CONNECTOR_HOST}
      # IdentityHub
      - EDC_IAM_IDENTITYHUB_URL=http://edc-ih-${ED_NODE_INSTANCE_NAME}:7093
      - EDC_IAM_IDENTITYHUB_DID=${ED_NODE_DID}
      # Token validation endpoint
      - EDC_DATAPLANE_TOKEN_VALIDATION_ENDPOINT=http://${ED_NODE_INSTANCE_NAME}:8083/api/control/v3/dataplane/token
      - EDC_CONTROLPLANE_VALIDATION_ENDPOINT=http://${ED_NODE_INSTANCE_NAME}:8083/api/control/v3/dataplane/token
      # Logging
      - EDC_LOG_LEVEL=DEBUG
      - EDC_WEB_REST_CORS_ENABLED=true
      - EDC_MONITOR_LEVEL=DEBUG
      ########################### IssuerService-VC Link ###########################
      - UNIMAAS_ISSUERSERVICEVC_DID=${UNIMAAS_ISSUERSERVICEVC_DID}
      ########################### Local Mock Registry Link ###########################
      - UNIMAAS_MOCKREGISTRY_CONTEXT_URL=${MOCKREGISTRY_CONTEXT_URL}
      ########################### Require extra VC for CatalogRequest ###########################
      - UNIMAAS_ENABLE_EXTRA_VP_CATALOGREQUEST=${CONNECTOR_UNIMAAS_ENABLE_EXTRA_VP_CATALOGREQUEST}
      ########################### Vault Link ###########################
      # Since there is a dynamic token acquisition approach that stores the token value in edc.vault.hashicorp.token (see entrypoint) it no longer makes sense to define the parameter
      # EDC_VAULT_HASHICORP_TOKEN_FILE which is to indicate the file where said value is statically.
      # If this were to be touched it would be necessary:
      # a) define - EDC_VAULT_HASHICORP_TOKEN_FILE=/vault-token/token
      # b) no use -Dedc.vault.hashicorp.token in entrypoint
      # EDC_VAULT_HASHICORP_TOKEN=hvs.CAESINBbqCBur_pxAwnhUlwH2qfdTbG3j1a3bR9omlYLKY_tGh4KHGh2cy52aktZdXBiY2xNdmprd1N1N29IUTVmekg
      #- EDC_VAULT_HASHICORP_API_SECRET_PATH= At the moment there is no choice and it takes the configuration file (edc.vault.hashicorp.api.secret.path) by default.

  central-platform-digital-thread:
    hostname: central-platform-digital-thread
    image: digital-thread 
    container_name: central-platform-digital-thread
    env_file:
      - ./env/digital_thread.env
    volumes:
      - ../deployment/config/demo_dms.json:/etc/app/demo_dms.json:ro
    networks:
      - edc-network

  central-platform-kg-api:
    image: centralkg-api
    hostname: central-platform-kg-api
    container_name: central-platform-kg-api
    env_file: "./centralKG_API/api.env"
    ports:
      - "80:8000"
    networks:
      - edc-network

